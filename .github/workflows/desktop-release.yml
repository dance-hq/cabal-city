name: Desktop release

# Push a tag like v0.2.0 to build Cabal for macOS, Windows and Linux and attach
# the installers to a GitHub Release. Set the repository variable CABAL_APP_URL
# to the address of your hosted Cabal first.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check

      - name: Point the app at your hosted Cabal
        # Forks: set the repository variable CABAL_APP_URL. Without it the
        # address already in desktop/app.json is used.
        if: ${{ vars.CABAL_APP_URL != '' }}
        env:
          CABAL_APP_URL: ${{ vars.CABAL_APP_URL }}
        run: node -e "const f='app.json',c=JSON.parse(require('fs').readFileSync(f));c.appUrl=process.env.CABAL_APP_URL;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"

      - name: Match the version to the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Sign Windows builds with Azure Artifact Signing
        # Turned on by the repository variable AZURE_SIGNING_ENDPOINT. Once it is set,
        # a missing setting stops the release instead of quietly shipping it unsigned:
        # signed installs only accept signed updates from the same publisher.
        if: runner.os == 'Windows'
        env:
          AZURE_SIGNING_ENDPOINT: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          AZURE_SIGNING_ACCOUNT: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          AZURE_SIGNING_PROFILE: ${{ vars.AZURE_SIGNING_PROFILE }}
          WINDOWS_PUBLISHER_NAME: ${{ vars.WINDOWS_PUBLISHER_NAME }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
        run: |
          if [ -z "$AZURE_SIGNING_ENDPOINT" ]; then
            echo "::warning::Windows build is unsigned (repository variable AZURE_SIGNING_ENDPOINT is not set)."
            exit 0
          fi
          missing=""
          for v in AZURE_SIGNING_ACCOUNT AZURE_SIGNING_PROFILE WINDOWS_PUBLISHER_NAME AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET; do
            if [ -z "${!v}" ]; then missing="$missing $v"; fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Windows signing is turned on but these are not set:$missing"
            exit 1
          fi
          node -e "
            const fs = require('fs'), p = JSON.parse(fs.readFileSync('package.json')), e = process.env
            p.build.win.azureSignOptions = {
              publisherName: e.WINDOWS_PUBLISHER_NAME,
              endpoint: e.AZURE_SIGNING_ENDPOINT,
              codeSigningAccountName: e.AZURE_SIGNING_ACCOUNT,
              certificateProfileName: e.AZURE_SIGNING_PROFILE,
            }
            p.build.forceCodeSigning = true
            p.build.afterSign = 'build/verify-windows-signature.cjs'
            fs.writeFileSync('package.json', JSON.stringify(p, null, 2))
          "
          # The Azure sign-in electron-builder uses reads these three from the environment.
          {
            echo "AZURE_TENANT_ID=$AZURE_TENANT_ID"
            echo "AZURE_CLIENT_ID=$AZURE_CLIENT_ID"
            echo "AZURE_CLIENT_SECRET=$AZURE_CLIENT_SECRET"
            echo "WINDOWS_PUBLISHER_NAME=$WINDOWS_PUBLISHER_NAME"
          } >> "$GITHUB_ENV"

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional Mac signing. Without these, macOS builds are unsigned.
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Unset secrets arrive as empty strings, which electron-builder reads as a path ("desktop not a file").
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          # Windows signs through Azure (step above), never a certificate file on the runner.
          if [ "$RUNNER_OS" = "Windows" ]; then unset CSC_LINK CSC_KEY_PASSWORD; fi
          if [ -z "${CSC_LINK:-}" ] && [ "$RUNNER_OS" = "macOS" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          # The app lives in desktop/, so electron-builder can't find the repo on its own.
          node -e "const f='package.json',p=JSON.parse(require('fs').readFileSync(f));p.repository='https://github.com/'+process.env.GITHUB_REPOSITORY;require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
          if [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            npx electron-builder --publish always
          else
            npx electron-builder --publish never
          fi

      - name: Check the Windows installer signature
        if: runner.os == 'Windows' && vars.AZURE_SIGNING_ENDPOINT != ''
        shell: pwsh
        run: |
          foreach ($f in Get-ChildItem dist/*.exe) {
            $s = Get-AuthenticodeSignature -LiteralPath $f.FullName
            "$($f.Name): $($s.Status) — $($s.SignerCertificate.Subject)"
            if ($s.Status -ne 'Valid') { throw "$($f.Name) is not validly signed" }
          }

      - name: Keep the installers from a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: cabal-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: warn
