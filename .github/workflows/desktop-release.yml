name: Desktop release

# Push a tag like v0.2.0 to build Cabal for macOS, Windows and Linux and attach
# the installers to a GitHub Release. Set the repository variable CABAL_APP_URL
# to the address of your hosted Cabal first.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - run: npm ci
      - run: npm run check

      - name: Point the app at your hosted Cabal
        # Forks: set the repository variable CABAL_APP_URL. Without it the
        # address already in desktop/app.json is used.
        if: ${{ vars.CABAL_APP_URL != '' }}
        env:
          CABAL_APP_URL: ${{ vars.CABAL_APP_URL }}
        run: node -e "const f='app.json',c=JSON.parse(require('fs').readFileSync(f));c.appUrl=process.env.CABAL_APP_URL;require('fs').writeFileSync(f,JSON.stringify(c,null,2))"

      - name: Match the version to the tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${GITHUB_REF_NAME#v}" --no-git-tag-version --allow-same-version

      - name: Build and publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional signing. Without these, macOS and Windows builds are unsigned.
          CSC_LINK: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WIN_CSC_LINK: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CSC_LINK" ] && [ "$RUNNER_OS" = "macOS" ]; then export CSC_IDENTITY_AUTO_DISCOVERY=false; fi
          # The app lives in desktop/, so electron-builder can't find the repo on its own.
          node -e "const f='package.json',p=JSON.parse(require('fs').readFileSync(f));p.repository='https://github.com/'+process.env.GITHUB_REPOSITORY;require('fs').writeFileSync(f,JSON.stringify(p,null,2))"
          if [ -n "$GITHUB_REF_NAME" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            npx electron-builder --publish always
          else
            npx electron-builder --publish never
          fi

      - name: Keep the installers from a manual run
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: cabal-${{ matrix.os }}
          path: |
            desktop/dist/*.dmg
            desktop/dist/*.zip
            desktop/dist/*.exe
            desktop/dist/*.AppImage
            desktop/dist/*.deb
          if-no-files-found: warn
