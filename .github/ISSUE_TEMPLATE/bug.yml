name: Something's broken
description: A bug in the web app, the desktop app or self-hosting.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what you saw instead. Please leave out other people's messages.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - cabal.city in a browser
        - Desktop app (macOS)
        - Desktop app (Windows)
        - Desktop app (Linux)
        - My own deployment
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The desktop app version if you know it, or the browser you used.
  - type: textarea
    id: steps
    attributes:
      label: Steps to see it again
      placeholder: |
        1. …
        2. …
