<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'" />
    <title>Cabal</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0; height: 100vh; display: flex; align-items: center; justify-content: center;
        background: #16161a; color: #e8e8ec; font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      main { max-width: 320px; padding: 24px; display: flex; flex-direction: column; gap: 12px; }
      h1 { margin: 0; font-size: 15px; font-weight: 600; }
      p { margin: 0; color: #9a9aa6; }
      .star { color: #f5b82e; }
      button {
        align-self: flex-start; margin-top: 4px; padding: 6px 12px; border-radius: 6px; cursor: pointer;
        border: 1px solid #f5b82e; background: transparent; color: #f5b82e; font: inherit;
      }
      button:focus-visible { outline: 2px solid #f5b82e; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1><span class="star">**</span> Can&apos;t reach Cabal</h1>
      <p>Check your internet connection. Cabal will try again on its own every few seconds.</p>
      <button type="button" id="retry" autofocus>Try again now</button>
    </main>
    <script>
      document.getElementById('retry').addEventListener('click', () => window.cabalDesktop?.retry())
    </script>
  </body>
</html>
