pmOnFail: ignore

minimumReleaseAgeExclude:
  - '@next/*'
  - next

# Patched releases of build-time packages pulled in by next and tailwind.
# Same major versions; drop each line once next ships the fix itself.
overrides:
  nanoid@<3.3.18: ^3.3.18
  source-map-js@<1.2.2: ^1.2.2
  browserslist@<4.28.7: ^4.28.7
  baseline-browser-mapping@<2.11.0: ^2.11.0

allowBuilds:
  esbuild: true
  electron: false
